<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BreakBite - Break Planner</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Planner-only additions. Colours come from the theme variables in style.css */
    .result-title { margin: 28px 0 12px; font-size: 22px; color: var(--accent); }
    .card h3 { font-size: 18px; margin-bottom: 10px; }
  </style>
</head>
<body>
 
<header class="top">
  <div class="brand">BreakBite</div>
  <nav class="tabs" aria-label="Main sections">
    <a class="tab" href="student.html">Order</a>
    <a class="tab active" href="planner.html">Break Planner</a>
    <a class="tab" href="home.html">Home</a>
  </nav>
</header>
 
<main class="narrow">
  <h1>Break Planner</h1>
  <p class="intro">Tell us how long your break is and how much money you have. We will suggest up to five good combos that fit both.</p>
 
  <div class="card">
    <h2>Your break</h2>
    <div class="form-grid">
      <label>Break time (minutes)
        <input type="number" id="time" placeholder="e.g. 15">
      </label>
      <label>Money (Tk)
        <input type="number" id="money" min="0" placeholder="e.g. 100">
      </label>
    </div>
    <button id="plan-btn" disabled>Loading menu...</button>
    <p class="error" id="error" role="alert"></p>
  </div>
 
  <div id="result-area" hidden>
    <h2 class="result-title">Suggested combos</h2>
    <div id="result-cards"></div>
  </div>
</main>
 
<script type="module">
import { db } from "./firebase.js";
import {
  collection, doc, getDoc, getDocs, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
 
const DEFAULTS = { minBreak: 10, maxBreak: 45, step: 5, defaultEat: 5 };
const OPTION_COUNT = 5;      // how many combos to show
const MIN_DIFFERENCE = 2;    // two combos must differ by at least this many items
const SEARCH_LIMIT = 2000000; // safety cap on how many item sets are checked
 
let settings = Object.assign({}, DEFAULTS);
let foods = [];
 
const $ = function (id) { return document.getElementById(id); };
 
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
 
function showError(msg) {
  $("error").textContent = msg;
  if (msg) $("result-area").hidden = true;
}
 
function finalPrice(f) {
  return Math.round(f.price * (100 - (f.discount || 0)) / 100);
}
 
// ---------- load settings and menu once ----------
async function load() {
  try {
    const sSnap = await getDoc(doc(db, "settings", "planner"));
    if (sSnap.exists()) settings = Object.assign({}, DEFAULTS, sSnap.data());
  } catch (err) {
    console.error(err); // fall back to defaults
  }
 
  try {
    const snap = await getDocs(query(collection(db, "menu"), orderBy("order")));
    foods = snap.docs
      .map(function (d) { return Object.assign({ id: d.id }, d.data()); })
      .filter(function (f) { return f.available !== false; })
      .map(function (f) {
        return {
          name: f.name,
          price: finalPrice(f),
          discount: f.discount || 0,
          minutes: f.minutes > 0 ? f.minutes : settings.defaultEat
        };
      })
      .filter(function (f) { return f.price >= 0 && f.minutes > 0; });
  } catch (err) {
    console.error(err);
    showError("Could not load the menu. Check your internet and refresh.");
    $("plan-btn").textContent = "Show options";
    return;
  }
 
  const t = $("time");
  t.min = settings.minBreak;
  t.max = settings.maxBreak;
  t.step = settings.step;
  t.placeholder = "e.g. " + Math.min(settings.maxBreak, Math.max(settings.minBreak, 15));
 
  $("plan-btn").disabled = false;
  $("plan-btn").textContent = "Show options";
  if (!foods.length) showError("No food is available right now. Please check again later.");
}
 
// ---------- find the best combos ----------
// A combo is a set of different items. Each item is used at most once.
// Score: more items first, then more of the break time used, then more of the money used.
// Options must differ from each other by at least MIN_DIFFERENCE items, so the 5 choices are not near-copies.
function findOptions(minutes, money) {
  const items = foods.filter(function (f) { return f.minutes <= minutes && f.price <= money; });
  const n = items.length;
  const KEEP = 400;
  const chosen = [];
  let visited = 0;
  let pool = [];
 
  function score(count, t, m) {
    return count * 10 + 5 * (t / minutes) + (money > 0 ? 5 * (m / money) : 0);
  }
 
  function search(start, t, m) {
    if (++visited > SEARCH_LIMIT) return;
    if (chosen.length) {
      pool.push({ idx: chosen.slice(), t: t, m: m, s: score(chosen.length, t, m) });
      if (pool.length > KEEP * 8) {
        pool.sort(function (a, b) { return b.s - a.s; });
        pool = pool.slice(0, KEEP);
      }
    }
    for (let i = start; i < n; i++) {
      const f = items[i];
      if (t + f.minutes > minutes || m + f.price > money) continue;
      chosen.push(i);
      search(i + 1, t + f.minutes, m + f.price);
      chosen.pop();
    }
  }
 
  search(0, 0, 0);
  pool.sort(function (a, b) { return b.s - a.s; });
 
  const picked = [];
  for (let k = 0; k < pool.length && picked.length < OPTION_COUNT; k++) {
    const c = pool[k];
    const ok = picked.every(function (p) {
      const shared = c.idx.filter(function (i) { return p.idx.indexOf(i) >= 0; }).length;
      return c.idx.length + p.idx.length - 2 * shared >= MIN_DIFFERENCE;
    });
    if (ok) picked.push(c);
  }
 
  return picked.map(function (c) {
    return {
      items: c.idx.map(function (i) { return items[i]; }),
      time: c.t,
      cost: c.m
    };
  });
}
 
// ---------- show results ----------
function renderOptions(options, minutes, money) {
  const area = $("result-area");
  const cards = $("result-cards");
 
  if (!options.length) {
    cards.innerHTML = '<div class="card"><div class="empty">Nothing fits in ' + minutes +
      ' minutes and ' + money + ' Tk. Try more time or money.</div></div>';
  } else {
    cards.innerHTML = options.map(function (o, k) {
      const rows = o.items.map(function (f) {
        const off = f.discount > 0 ? ' <span class="badge">' + f.discount + '% off</span>' : '';
        return '<div class="item"><div><div class="name">' + esc(f.name) + off + '</div></div>' +
          '<div class="price">' + f.price + ' Tk</div></div>';
      }).join("");
      return '<div class="card">' +
        '<h3>Option ' + (k + 1) + '</h3>' +
        '<div class="summary">' +
          '<span>Time used: ' + o.time + ' of ' + minutes + ' min</span>' +
          '<b>Total: ' + o.cost + ' Tk (left ' + (money - o.cost) + ' Tk)</b>' +
        '</div>' +
        rows +
      '</div>';
    }).join("");
    if (options.length < OPTION_COUNT) {
      cards.innerHTML += '<p class="muted">Only ' + options.length + ' different combo(s) fit this time and money.</p>';
    }
  }
  area.hidden = false;
}
 
$("plan-btn").addEventListener("click", function () {
  const minutes = parseInt($("time").value, 10);
  const money = parseInt($("money").value, 10);
 
  if (isNaN(minutes) || minutes < settings.minBreak || minutes > settings.maxBreak) {
    showError("Please enter a break time between " + settings.minBreak + " and " + settings.maxBreak + " minutes.");
    return;
  }
  if (isNaN(money) || money < 0) {
    showError("Please enter how much money you have.");
    return;
  }
  if (!foods.length) {
    showError("No food is available right now. Please check again later.");
    return;
  }
  showError("");
  renderOptions(findOptions(minutes, money), minutes, money);
});
 
load();
</script>
 
</body>
</html>
